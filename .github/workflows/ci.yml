name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        env:
          # CI-only throwaway value; config.py refuses to start without one.
          FLASK_SECRET_KEY: ci-only-not-a-real-secret
          GEMINI_API_KEY: ci-only-dummy-key  # client is built at import; tests never call it
        run: python3 -m pytest
