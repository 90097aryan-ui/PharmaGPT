services:
  - type: web
    name: pharmagpt
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    # worker-class gthread is required for --threads to have any effect —
    # gunicorn's default "sync" worker class ignores --threads entirely and
    # serves one request at a time per worker, which silently defeats the
    # concurrency database.py's SQLite WAL/busy_timeout setup is tuned for.
    # --bind 0.0.0.0:$PORT is required — gunicorn defaults to 127.0.0.1:8000,
    # which Render's routing layer cannot reach; $PORT is injected by Render.
    startCommand: gunicorn pharmagpt.app:app --bind 0.0.0.0:$PORT --worker-class=gthread --workers=2 --threads=4 --timeout=60 --worker-tmp-dir /dev/shm --keep-alive=5
    healthCheckPath: /health
    disk:
      name: pharmagpt-data
      mountPath: /var/data
      # Holds the SQLite DB plus generated documents and uploads (both
      # previously defaulted to the ephemeral app filesystem and were wiped
      # on every redeploy — see DB_PATH/UPLOAD_FOLDER/GENERATED_DOCS_PATH
      # below). Sized for document-heavy usage; raise if disk usage alerts.
      sizeGB: 5
    envVars:
      - key: DB_PATH
        value: /var/data/pharmagpt.db
      - key: UPLOAD_FOLDER
        value: /var/data/uploads
      - key: GENERATED_DOCS_PATH
        value: /var/data/generated_documents
      - key: GEMINI_API_KEY
        sync: false
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: FLASK_DEBUG
        value: "false"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      # Required by pharmagpt/services/identity_admin.py::provision_user()
      # (routes/companies.py::create_company, routes/users.py::invite_user)
      # — the one live-request path allowed to bypass RLS to mint a new
      # Supabase Auth identity. Without this set, company creation and user
      # invitation fail at runtime with a clean 500 ("SUPABASE_SERVICE_ROLE_KEY
      # not found in .env"). NOT auto-populated by sync:false — set the real
      # value by hand in the Render dashboard (Supabase project settings ->
      # API -> service_role key). See docs/DEPLOYMENT_RUNBOOK.md.
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # ── Phase 3 Postgres migration flags — DO NOT set to "dual"/"postgres"
      # in this environment yet. Cutover is gated on an extended Staging
      # soak of each flag in "dual" plus a 2-company RLS isolation
      # spot-check per domain (docs/PHASE3_EXECUTION_PLAN.md §3.6,
      # docs/PHASE3_FLAGS.md) — neither has been performed. Once both are
      # done and PHASE3_FLAGS.md is updated accordingly, flip these here:
      #   - key: PROJECTS_BACKEND
      #     value: dual
      #   - key: KB_BACKEND
      #     value: dual
      #   - key: EQUIPMENT_BACKEND
      #     value: dual
      #   - key: QMS_BACKEND
      #     value: dual
      # Leaving them unset keeps every domain on its "sqlite" default.

      # ── Backup & Recovery (pharmagpt/services/backup_service.py) ─────────────
      # See docs/BACKUP_SOP.md §4 "One-time setup" before relying on any of this.
      - key: BACKUP_DIR
        value: /var/data/backups
      # In-process backup scheduler (services/backup_scheduler.py). It runs in
      # THIS web service because only the service that owns the disk can read
      # the database; a Render cron job cannot mount it. Keep "false" until
      # BACKUP_ENCRYPTION_KEY and the BACKUP_OFFSITE_STORAGE_* variables below
      # are set and one manual run from /admin/backup has succeeded, then set
      # "true". The dashboard only reports scheduling healthy while the
      # scheduler heartbeat is fresh, whatever this flag says.
      - key: BACKUP_SCHEDULER_ENABLED
        value: "false"
      # No generateValue here on purpose — Render's generated-value format is
      # not guaranteed to be a valid Fernet key, and a security-critical key
      # must never silently take on a plausible-but-wrong value (same
      # reasoning FLASK_SECRET_KEY's dev-fallback was flagged as a Critical
      # gap for doing the opposite). Generate with `python
      # scripts/generate_backup_key.py` and paste the result here by hand.
      - key: BACKUP_ENCRYPTION_KEY
        sync: false
      # Independent off-site copy of every encrypted archive (Supabase Storage,
      # private bucket). Set all three together, ideally on a SEPARATE
      # Supabase project from production; the key must not be the production
      # service-role key. See docs/BACKUP_SOP.md section 4.
      - key: BACKUP_OFFSITE_STORAGE_URL
        sync: false
      - key: BACKUP_OFFSITE_STORAGE_KEY
        sync: false
      - key: BACKUP_OFFSITE_STORAGE_BUCKET
        sync: false
      # Optional — a second LOCAL directory the archive is also copied to. It is
      # not independent storage (same host/disk unless separately mounted).
      - key: BACKUP_OFFSITE_DIR
        sync: false
      # Optional — Slack/Teams/PagerDuty/Opsgenie-compatible incoming
      # webhook URL, notified on backup failure and staleness.
      - key: BACKUP_ALERT_WEBHOOK_URL
        sync: false
      # Optional — direct Postgres connection string (Supabase dashboard ->
      # Settings -> Database -> Connection string) for a supplementary
      # pg_dump, only used if the pg_dump binary also happens to be on
      # PATH. Not required — the primary Postgres backup mechanism (a
      # PostgREST JSON export) works without this. See
      # docs/BACKUP_ARCHITECTURE.md §5.
      - key: SUPABASE_DB_URL
        sync: false
